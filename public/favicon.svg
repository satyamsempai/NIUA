<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Modern gradient for the primary brand style -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <!-- Indigo to Cyan gradient for charts and growth lines -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <!-- Soft glow or depth shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Solid rounded background matching dashboard style -->
  <rect width="128" height="128" rx="28" fill="#111726" stroke="#24304f" stroke-width="4"/>

  <!-- High-fidelity geometric layout symbolizing property analytics (building + bar chart) -->
  <g transform="translate(16, 16)" filter="url(#dropShadow)">
    <!-- Column 1 (Left bar of the chart / wing of building) -->
    <rect x="12" y="44" width="18" height="40" rx="4" fill="url(#primaryGrad)" />
    
    <!-- Column 2 (Middle bar of the chart / main tower) -->
    <rect x="38" y="24" width="18" height="60" rx="4" fill="url(#primaryGrad)" />
    
    <!-- Column 3 (Right bar of the chart / analytics indicator) -->
    <rect x="64" y="8" width="18" height="76" rx="4" fill="url(#cyanGrad)" />

    <!-- A growth/arrow line overlaying the chart -->
    <path d="M 8 72 L 32 50 L 58 32 L 88 12" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 74 12 L 88 12 L 88 26" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- A gold rupee symbol inside a glowing coin, representing tax/revenue -->
    <circle cx="21" cy="21" r="14" fill="#161e30" stroke="#f59e0b" stroke-width="3" />
    <!-- Rupee symbol details (very clean vector) -->
    <path d="M 16 16 H 26 M 16 20 H 24 M 18 16 C 24 16 24 24 18 24 H 17 M 19 24 L 24 30" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>